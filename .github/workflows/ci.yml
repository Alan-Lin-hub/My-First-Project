name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check backend/

      # Unit tests are fully mocked (no API key / network). Integration tests are
      # skipped automatically unless RUN_INTEGRATION / DEEPSEEK_API_KEY is set.
      - name: Test (pytest)
        run: uv run pytest -q
