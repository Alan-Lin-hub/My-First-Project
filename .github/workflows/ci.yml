name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check backend/

      # Unit tests are fully mocked (no API key / network). Integration tests are
      # skipped automatically unless RUN_INTEGRATION / DEEPSEEK_API_KEY is set.
      - name: Test (pytest)
        run: uv run pytest -q

  # CD: SSH into the AWS Lightsail instance and run deploy.sh (git pull → uv sync
  # → systemctl restart → health check). Only on a push to main, after `test`
  # passes. Runs on a GitHub-hosted runner — no dependency on any local machine.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: cd /opt/course-rag && bash scripts/deploy.sh
