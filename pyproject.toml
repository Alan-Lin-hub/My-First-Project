[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
    "openai>=2.38.0",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "bcrypt>=4.3.0",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]          # backend uses flat imports (from vector_store import ...)
testpaths = ["backend/tests"]
markers = [
    "integration: needs a real DEEPSEEK_API_KEY / network access",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Default rules (E4/E7/E9 + pyflakes F). E402 is ignored because several modules
# intentionally run setup before imports — warnings.filterwarnings (app.py),
# logging.basicConfig, and sys.path injection (tests/conftest.py).
ignore = ["E402"]
